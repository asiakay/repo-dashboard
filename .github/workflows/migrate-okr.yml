name: Apply OKR Migration & Set MCP Secret

# One-time workflow — run manually from Actions → "Run workflow".
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with D1 + Pages edit access
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Optional GitHub secret (set before running if you want the endpoint protected):
#   MCP_SECRET_TOKEN — Bearer token to protect POST /api/mcp.
#                      If absent, the MCP endpoint stays open (fine for dev).
#
# Steps:
#   1. Apply db/migrations/0002_okr_task_tracker.sql to the remote D1 database.
#   2. Push MCP_SECRET_TOKEN to Cloudflare Pages secrets (skipped if not set).

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ── Step 1: Apply D1 migration ────────────────────────────────────────
      - name: Apply OKR migration to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute repo-dashboard-work-items \
            --remote \
            --file db/migrations/0002_okr_task_tracker.sql

      # ── Step 2: Push MCP_SECRET_TOKEN to Cloudflare Pages (optional) ──────
      # Skipped silently when the MCP_SECRET_TOKEN GitHub secret is not set.
      # (secrets context is not available in `if:` expressions — check inside run.)
      - name: Push MCP_SECRET_TOKEN to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_SECRET_TOKEN: ${{ secrets.MCP_SECRET_TOKEN }}
        run: |
          if [ -z "$MCP_SECRET_TOKEN" ]; then
            echo "MCP_SECRET_TOKEN not set — skipping Pages secret push."
            exit 0
          fi
          echo "$MCP_SECRET_TOKEN" | \
            npx wrangler@latest pages secret put MCP_SECRET_TOKEN \
              --project-name repo-dashboard
        continue-on-error: true
