name: Apply Resources Migration

# One-time workflow — run manually from Actions → "Run workflow".
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with D1 + Pages edit access
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Applies db/migrations/0007_resources_and_okr_timestamps.sql:
#   ALTER TABLE okrs ADD COLUMN created_at DATETIME DEFAULT CURRENT_TIMESTAMP;
#   CREATE TABLE resources (...);

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply resources migration to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute repo-dashboard-work-items \
            --remote \
            --file db/migrations/0007_resources_and_okr_timestamps.sql
