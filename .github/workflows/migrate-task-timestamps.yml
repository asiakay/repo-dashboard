name: Apply Task Timestamps Migration

# One-time workflow — run manually from Actions → "Run workflow".
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with D1 edit access
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# Applies db/migrations/0003_task_timestamps.sql:
#   ALTER TABLE tasks ADD COLUMN started_at TEXT;
#   ALTER TABLE tasks ADD COLUMN completed_at TEXT;

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply task timestamps migration to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute repo-dashboard-work-items \
            --remote \
            --file db/migrations/0003_task_timestamps.sql
