name: Sync Deadline Signals

# Required secrets:
#   LEGALAIDE_SYNC_TOKEN  — bearer token for LegalAide's /api/deadline-signals endpoint
#                           (generated by Asia, stored as a GitHub Actions secret)
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with D1 edit permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account ID
#
# The workflow runs without LEGALAIDE_SYNC_TOKEN or Cloudflare creds configured —
# LegalAide signals and the D1 sync step are simply skipped until those are set up.
# public/data/deadline-signals.json is committed regardless, as a readable record.

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"  # :30 past each hour, offset from repos update at :00

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ============================================================
      # 1. FETCH DEADLINE SIGNALS FROM ECOSYSTEM REPOS
      # ============================================================
      - name: Fetch deadline signals from ecosystem repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGALAIDE_SYNC_TOKEN: ${{ secrets.LEGALAIDE_SYNC_TOKEN }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const https = require('https');

          function httpsGet(url, headers) {
            return new Promise((resolve, reject) => {
              const req = https.get(url, { headers }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  const code = res.statusCode;
                  if (code === 200) {
                    try { resolve(JSON.parse(data)); } catch { resolve(null); }
                  } else if (code === 404 || code === 403 || code === 401) {
                    resolve(null);
                  } else {
                    reject(new Error(`HTTP ${code} for ${url}`));
                  }
                });
              });
              req.on('error', reject);
              req.setTimeout(10000, () => { req.destroy(); reject(new Error('Timeout')); });
            });
          }

          async function fetchFileFromRepo(owner, name, path, token) {
            const url = `https://api.github.com/repos/${owner}/${name}/contents/${path}`;
            const resp = await httpsGet(url, {
              Authorization: `token ${token}`,
              'User-Agent': 'repo-dashboard/1.0',
              Accept: 'application/vnd.github.v3+json',
            });
            if (!resp || !resp.content) return null;
            try {
              return JSON.parse(Buffer.from(resp.content, 'base64').toString('utf8'));
            } catch { return null; }
          }

          async function fetchApiSignals(apiUrl, bearerToken) {
            const parsed = new URL(apiUrl);
            return new Promise((resolve, reject) => {
              const req = https.get({
                hostname: parsed.hostname,
                path: parsed.pathname + parsed.search,
                headers: {
                  Authorization: `Bearer ${bearerToken}`,
                  Accept: 'application/json',
                  'User-Agent': 'repo-dashboard/1.0',
                },
              }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (res.statusCode === 200) {
                    try { resolve(JSON.parse(data)); } catch { resolve(null); }
                  } else {
                    console.warn(`LegalAide API returned HTTP ${res.statusCode}`);
                    resolve(null);
                  }
                });
              });
              req.on('error', reject);
              req.setTimeout(10000, () => { req.destroy(); reject(new Error('Timeout')); });
            });
          }

          async function main() {
            const repos = JSON.parse(fs.readFileSync('config/ecosystem-repos.json', 'utf8'));
            const ghToken = process.env.GH_TOKEN || '';
            const legalToken = process.env.LEGALAIDE_SYNC_TOKEN || '';
            const lastSynced = new Date().toISOString();
            const allSignals = [];

            for (const repo of repos) {
              if (!repo.name || repo.name.startsWith('_')) continue;

              try {
                let signals = null;

                if (repo.sync === 'api') {
                  const apiUrl = repo.api_url || '';
                  if (!legalToken || apiUrl.includes('PLACEHOLDER')) {
                    console.log(`Skipping ${repo.name}: API URL or token not configured yet`);
                    continue;
                  }
                  signals = await fetchApiSignals(apiUrl, legalToken);
                  if (!Array.isArray(signals)) {
                    console.warn(`${repo.name}: API returned non-array, skipping`);
                    continue;
                  }
                } else {
                  for (const path of ['public/deadline-signals.json', '.claude/deadline-signals.json']) {
                    signals = await fetchFileFromRepo(repo.owner, repo.name, path, ghToken);
                    if (signals !== null) break;
                  }
                  if (signals === null) {
                    console.log(`${repo.name}: no deadline-signals.json found, skipping`);
                    continue;
                  }
                  if (!Array.isArray(signals)) {
                    console.warn(`${repo.name}: invalid format, skipping`);
                    continue;
                  }
                }

                for (const sig of signals) {
                  if (!sig.title || !sig.due_date) continue;
                  allSignals.push({
                    title: sig.title,
                    due_date: sig.due_date,
                    consequence_severity: Math.min(5, Math.max(1, parseInt(sig.consequence_severity) || 3)),
                    affects_repos: Array.isArray(sig.affects_repos) ? sig.affects_repos : [],
                    source_repo: repo.name,
                    domain: sig.domain || 'default',
                    notes: sig.notes || null,
                    last_synced: lastSynced,
                  });
                }
                console.log(`Fetched ${signals.length} signal(s) from ${repo.name}`);
              } catch (err) {
                console.warn(`Error fetching from ${repo.name}: ${err.message}`);
              }
            }

            fs.mkdirSync('public/data', { recursive: true });
            fs.writeFileSync('public/data/deadline-signals.json', JSON.stringify(allSignals, null, 2));
            console.log(`Total signals written: ${allSignals.length}`);
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF

      # ============================================================
      # 2. COMMIT public/data/deadline-signals.json
      # ============================================================
      - name: Commit updated deadline-signals.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deadline-signals.json"
          file_pattern: public/data/deadline-signals.json

      # ============================================================
      # 3. SYNC deadline_signals TABLE IN D1
      # Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets.
      # Skipped gracefully (continue-on-error) if not yet configured.
      # ============================================================
      - name: Generate D1 sync SQL
        run: |
          node << 'EOF'
          const fs = require('fs');
          const signals = JSON.parse(fs.readFileSync('public/data/deadline-signals.json', 'utf8'));

          function esc(v) {
            return String(v == null ? '' : v).replace(/'/g, "''");
          }

          let sql = 'DELETE FROM deadline_signals;\n';
          for (const sig of signals) {
            const repos = JSON.stringify(sig.affects_repos || []).replace(/'/g, "''");
            sql += `INSERT INTO deadline_signals (title, due_date, consequence_severity, affects_repos, source_repo, domain, notes, last_synced) VALUES (`
              + `'${esc(sig.title)}', '${esc(sig.due_date)}', ${sig.consequence_severity}, '${repos}', `
              + `'${esc(sig.source_repo)}', '${esc(sig.domain || 'default')}', `
              + `${sig.notes ? `'${esc(sig.notes)}'` : 'NULL'}, '${esc(sig.last_synced)}');\n`;
          }

          fs.writeFileSync('/tmp/deadline-signals.sql', sql);
          console.log(`SQL written for ${signals.length} signal(s)`);
          EOF

      - name: Execute D1 deadline_signals sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest d1 execute repo-dashboard-work-items \
            --remote \
            --file /tmp/deadline-signals.sql
        continue-on-error: true
