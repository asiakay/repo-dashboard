name: Update Repo Metadata

on:
  workflow_dispatch:

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/github-repo-metadata-audit-t742uo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update repo descriptions and topics
        env:
          GITHUB_TOKEN: ${{ secrets.METADATA_PAT }}
        run: python3 scripts/update-repo-metadata.py
