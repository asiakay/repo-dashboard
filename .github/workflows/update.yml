name: Initialize & Update Repo Dashboard

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  init-and-update:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 0. CHECKOUT + NODE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ============================================================
      # 1. FIRST-RUN DETECTOR
      # ============================================================
      - name: Check initialization status
        id: check_init
        run: |
          if [ -f ".project_initialized" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 2. INITIALIZE FOLDERS / FILES ON FIRST RUN ONLY
      # ============================================================
      - name: Create folder structure
        if: steps.check_init.outputs.initialized == 'false'
        run: |
          mkdir -p public/data \
                   public/js \
                   public/components \
                   public/icons \
                   public/assets \
                   worker \
                   scripts \
                   tests \
                   docs

      - name: Create placeholder files
        if: steps.check_init.outputs.initialized == 'false'
        run: |
          echo "<!-- Repo Dashboard -->" > public/index.html
          echo "/* styles */" > public/styles.css
          echo "{}" > public/data/repos.json
          echo "// Worker entrypoint" > worker/worker.js
          echo "// Process repos" > scripts/process-repos.js
          echo "// Tests" > tests/worker.test.js
          echo "# Architecture" > docs/architecture.md
          echo "// JS placeholder" > public/js/app.js

      - name: Stage initialization files
        if: steps.check_init.outputs.initialized == 'false'
        run: |
          git add public worker scripts tests docs
          echo "Initialized $(date)" > .project_initialized
          git add .project_initialized

      # ============================================================
      # 3. FETCH ALL REPOS WITH PAGINATION
      # ============================================================
      - name: Fetch ALL GitHub repositories (pagination)
        run: |
          mkdir -p public
          echo "[]" > /tmp/raw.json

          PAGE=1
          PER_PAGE=100

          while true; do
            echo "---- Fetching page $PAGE ----"

            curl -s \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/users/asiakay/repos?per_page=$PER_PAGE&page=$PAGE" \
              -o page.json

            COUNT=$(jq '. | length' page.json)
            echo "Items on page $PAGE: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "No more repos found."
              break
            fi

            jq -s ".[0] + .[1]" /tmp/raw.json page.json > merged.json
            mv merged.json /tmp/raw.json

            PAGE=$((PAGE + 1))
          done

          echo "Total repos fetched:"
          jq 'length' /tmp/raw.json

      - name: Debug raw.json
        run: |
          echo "==== RAW.JSON SAMPLE ===="
          head -n 40 /tmp/raw.json || true
          echo "========================="

      # ============================================================
      # 4. ENSURE public/data EXISTS
      # ============================================================
      - name: Ensure data directory exists
        run: mkdir -p public/data

      # ============================================================
      # 5. PROCESS raw.json → repos.json
      # ============================================================
      - name: Convert raw.json → repos.json
        run: |
          node << 'EOF'
          const fs = require('fs');

          const raw = JSON.parse(fs.readFileSync('/tmp/raw.json'));

          if (!Array.isArray(raw)) {
            fs.writeFileSync('public/data/repos.json', JSON.stringify({
              error: true,
              message: "GitHub API returned non-array response",
              github_response: raw,
              timestamp: new Date()
            }, null, 2));
            process.exit(0);
          }

          function health(repo) {
            let score = 0;
            const days = (Date.now() - new Date(repo.updated_at)) / 86400000;
            if (days > 30) score++;
            if (days > 180) score += 2;
            if (repo.open_issues_count > 5) score++;
            if (!repo.description) score++;
            return score < 2 ? "green" : score < 4 ? "yellow" : "red";
          }

          const cleaned = raw.map(r => ({
            name: r.name,
            full_name: r.full_name,
            url: r.html_url,
            description: r.description,
            created_at: r.created_at,
            updated_at: r.updated_at,
            language: r.language,
            open_issues: r.open_issues_count,
            stars: r.stargazers_count,
            forks: r.forks_count,
            topics: r.topics || [],
            health: health(r)
          }));

          const output = { generated_at: new Date().toISOString(), repos: cleaned };
          fs.writeFileSync('public/data/repos.json', JSON.stringify(output, null, 2));
          console.log("Wrote repos.json with", cleaned.length, "repos.");
          EOF

      # ============================================================
      # 6. SYNC GITHUB ISSUES LABELED "claude" → D1 WORK ITEMS
      # ============================================================
      - name: Sync claude-labeled issues to D1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          node << 'EOF'
          const token = process.env.GITHUB_TOKEN;
          const dashUrl = (process.env.DASHBOARD_URL || '').replace(/\/$/, '');

          if (!dashUrl) {
            console.log('DASHBOARD_URL not set — skipping issue sync. Add it to repo secrets to enable.');
            process.exit(0);
          }

          const fs = require('fs');
          let reposData;
          try {
            reposData = JSON.parse(fs.readFileSync('public/data/repos.json', 'utf8'));
          } catch (e) {
            console.log('Could not read repos.json — skipping issue sync.');
            process.exit(0);
          }

          const repos = Array.isArray(reposData) ? reposData : (reposData.repos || []);
          const twoDaysAgo = Date.now() - 2 * 24 * 60 * 60 * 1000;

          async function ghFetch(path) {
            const res = await fetch(`https://api.github.com${path}`, {
              headers: { Authorization: `token ${token}`, 'User-Agent': 'repo-dashboard/1.0' }
            });
            if (!res.ok) return null;
            return res.json();
          }

          async function postItem(body) {
            const res = await fetch(`${dashUrl}/api/work-items`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });
            if (!res.ok) {
              const text = await res.text();
              console.error(`  POST failed (${res.status}):`, text.slice(0, 200));
            }
          }

          async function closeIssue(repo_name, github_issue_number) {
            const res = await fetch(`${dashUrl}/api/work-items/close-issue`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ repo_name, github_issue_number }),
            });
            if (!res.ok) console.error(`  close-issue failed (${res.status})`);
          }

          for (const repo of repos) {
            const name = repo.name;

            // Upsert open issues labeled 'claude'
            const open = await ghFetch(`/repos/asiakay/${name}/issues?state=open&labels=claude&per_page=50`);
            if (Array.isArray(open)) {
              for (const issue of open) {
                if (issue.pull_request) continue;
                console.log(`  Upserting ${name}#${issue.number}: ${issue.title}`);
                await postItem({
                  repo_name: name,
                  task_description: issue.title,
                  status: 'not_started',
                  assigned_to: 'agent',
                  source_type: 'github_issue',
                  source_url: issue.html_url,
                  github_issue_number: issue.number,
                  notes: issue.body ? issue.body.slice(0, 500) : null,
                });
              }
            }

            // Mark recently-closed labeled issues as done
            const closed = await ghFetch(`/repos/asiakay/${name}/issues?state=closed&labels=claude&per_page=20&sort=updated`);
            if (Array.isArray(closed)) {
              for (const issue of closed) {
                if (issue.pull_request) continue;
                if (new Date(issue.updated_at).getTime() < twoDaysAgo) continue;
                console.log(`  Closing ${name}#${issue.number}`);
                await closeIssue(name, issue.number);
              }
            }
          }

          console.log('Issue sync complete.');
          EOF

      # ============================================================
      # 7. AUTO-COMMIT CHANGES
      # ============================================================
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update repos.json + dashboard data"
          file_pattern: |
            public/.nojekyll
            public/data/repos.json
            .project_initialized
            public/**
            worker/**
            scripts/**
            tests/**
            docs/**
