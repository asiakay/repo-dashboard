name: Initialize & Update Repo Dashboard

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write denylist from secret
        run: |
          mkdir -p .data-scan
          if [ -n "$DATA_SCAN_DENYLIST" ]; then
            printf '%s' "$DATA_SCAN_DENYLIST" > .data-scan/denylist.txt
          fi
        env:
          DATA_SCAN_DENYLIST: ${{ secrets.DATA_SCAN_DENYLIST }}
      - uses: asiakay/data-scan@v1
        with:
          fail-on-match: 'true'

  init-and-update:
    needs: scan
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 0. CHECKOUT + NODE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ============================================================
      # 1. FIRST-RUN DETECTOR
      # ============================================================
      - name: Check initialization status
        id: check_init
        run: |
          if [ -f ".project_initialized" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi

      # ============================================================
      # 2. INITIALIZE FOLDERS / FILES ON FIRST RUN ONLY
      # ============================================================
      - name: Create folder structure
        if: steps.check_init.outputs.initialized == 'false'
        run: |
          mkdir -p public/data \
                   public/js \
                   public/components \
                   public/icons \
                   public/assets \
                   worker \
                   scripts \
                   tests \
                   docs

      - name: Create placeholder files
        if: steps.check_init.outputs.initialized == 'false'
        run: |
          echo "<!-- Repo Dashboard -->" > public/index.html
          echo "/* styles */" > public/styles.css
          echo "{}" > public/data/repos.json
          echo "// Worker entrypoint" > worker/worker.js
          echo "// Process repos" > scripts/process-repos.js
          echo "// Tests" > tests/worker.test.js
          echo "# Architecture" > docs/architecture.md
          echo "// JS placeholder" > public/js/app.js

      - name: Stage initialization files
        if: steps.check_init.outputs.initialized == 'false'
        run: |
          git add public worker scripts tests docs
          echo "Initialized $(date)" > .project_initialized
          git add .project_initialized

      # ============================================================
      # 3. FETCH ALL REPOS WITH PAGINATION
      # ============================================================
      - name: Fetch ALL GitHub repositories (pagination)
        id: fetch_repos
        run: |
          mkdir -p public
          echo "[]" > /tmp/raw.json

          PAGE=1
          PER_PAGE=100

          while true; do
            echo "---- Fetching page $PAGE ----"

            HTTP_STATUS=$(curl -s -w "%{http_code}" \
              -H "Authorization: token ${{ secrets.REPOS_PAT }}" \
              "https://api.github.com/user/repos?type=all&per_page=$PER_PAGE&page=$PAGE" \
              -o page.json)

            # Fail loudly on an error response (e.g. expired REPOS_PAT) instead of
            # trying to merge an error object into the repo list.
            if [ "$HTTP_STATUS" != "200" ] || [ "$(jq -r 'type' page.json)" != "array" ]; then
              echo "::error::GitHub API returned HTTP $HTTP_STATUS on page $PAGE — check that the REPOS_PAT secret is valid and not expired."
              jq -c '{message, documentation_url}' page.json 2>/dev/null || head -c 500 page.json
              exit 1
            fi

            COUNT=$(jq '. | length' page.json)
            echo "Items on page $PAGE: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "No more repos found."
              break
            fi

            jq -s ".[0] + .[1]" /tmp/raw.json page.json > merged.json
            mv merged.json /tmp/raw.json

            PAGE=$((PAGE + 1))
          done

          echo "Total repos fetched:"
          jq 'length' /tmp/raw.json

      - name: Debug raw.json
        run: |
          echo "==== RAW.JSON SAMPLE ===="
          head -n 40 /tmp/raw.json || true
          echo "========================="

      # ============================================================
      # 4. ENSURE public/data EXISTS
      # ============================================================
      - name: Ensure data directory exists
        run: mkdir -p public/data

      # ============================================================
      # 5. PROCESS raw.json → repos.json
      # ============================================================
      - name: Convert raw.json → repos.json
        run: |
          node << 'EOF'
          const fs = require('fs');

          const raw = JSON.parse(fs.readFileSync('/tmp/raw.json'));

          if (!Array.isArray(raw)) {
            fs.writeFileSync('public/data/repos.json', JSON.stringify({
              error: true,
              message: "GitHub API returned non-array response",
              github_response: raw,
              timestamp: new Date()
            }, null, 2));
            process.exit(0);
          }

          function health(repo) {
            let score = 0;
            const days = (Date.now() - new Date(repo.updated_at)) / 86400000;
            if (days > 30) score++;
            if (days > 180) score += 2;
            if (repo.open_issues_count > 5) score++;
            if (!repo.description) score++;
            return score < 2 ? "green" : score < 4 ? "yellow" : "red";
          }

          const cleaned = raw.map(r => ({
            name: r.name,
            full_name: r.full_name,
            url: r.html_url,
            description: r.description,
            homepage: r.homepage || null,
            created_at: r.created_at,
            updated_at: r.updated_at,
            language: r.language,
            open_issues: r.open_issues_count,
            stars: r.stargazers_count,
            forks: r.forks_count,
            topics: r.topics || [],
            health: health(r),
            site_error: null
          }));

          const output = { generated_at: new Date().toISOString(), repos: cleaned };
          fs.writeFileSync('public/data/repos.json', JSON.stringify(output, null, 2));
          console.log("Wrote repos.json with", cleaned.length, "repos.");
          EOF

      # ============================================================
      # 6. PROBE LIVE SITES — site_error for every repo with a homepage
      # Logic lives in scripts/probe-sites.mjs (unit-tested in
      # tests/probe-sites.test.js). Writes site_error into repos.json and
      # the SQL that step 8 loads into D1's site_status table.
      # ============================================================
      - name: Probe live sites
        id: probe
        run: node scripts/probe-sites.mjs public/data/repos.json "$RUNNER_TEMP/site-status.sql"

      # ============================================================
      # 6a. SCAN GENERATED repos.json FOR PII/PHI
      # The scan job above checks the current commit; it cannot see
      # content generated at runtime in this job's workspace.
      # This step scans the freshly written file before it is committed.
      # ============================================================
      - name: Write denylist from secret
        run: |
          mkdir -p .data-scan
          if [ -n "$DATA_SCAN_DENYLIST" ]; then
            printf '%s' "$DATA_SCAN_DENYLIST" > .data-scan/denylist.txt
          fi
        env:
          DATA_SCAN_DENYLIST: ${{ secrets.DATA_SCAN_DENYLIST }}

      - name: Scan generated repos.json for PII/PHI
        id: pii_scan
        run: |
          node << 'EOF'
          const fs = require('fs');

          const PATTERNS = [
            { name: 'SSN',          re: /\b\d{3}-\d{2}-\d{4}\b/ },
            { name: 'US phone',     re: /\b(?:\+1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b/ },
            { name: 'US street',    re: /\b\d+\s+[A-Za-z][A-Za-z\s]{1,30}\s+(?:St(?:reet)?|Ave(?:nue)?|Blvd|Dr(?:ive)?|Rd|Ln|Lane|Ct|Court|Pl(?:ace)?|Way|Pkwy|Terr?(?:ace)?|Cir(?:cle)?|Hwy)\b/i },
            { name: 'court docket', re: /\b\d{2}[A-Z]\d{5}[A-Z]{2}\d{5}\b/ },
          ];

          const denylist = [];
          try {
            const raw = fs.readFileSync('.data-scan/denylist.txt', 'utf8');
            for (const line of raw.split('\n')) {
              const t = line.trim();
              if (t && !t.startsWith('#')) denylist.push(t.toLowerCase());
            }
          } catch {}

          const content = fs.readFileSync('public/data/repos.json', 'utf8');
          const lines = content.split('\n');

          let found = false;
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            for (const { name, re } of PATTERNS) {
              if (re.test(line)) {
                // Report location only — never echo matched content
                console.error(`public/data/repos.json:${i + 1} [${name}]`);
                found = true;
              }
            }
            const lower = line.toLowerCase();
            for (const entry of denylist) {
              if (lower.includes(entry)) {
                console.error(`public/data/repos.json:${i + 1} [denylist]`);
                found = true;
              }
            }
          }

          if (found) {
            console.error('\nPII/PHI match in generated repos.json — commit blocked.');
            process.exit(1);
          }
          console.log('repos.json scan clean.');
          EOF

      # ============================================================
      # 6b. FETCH PR DATA FOR ACTIVE REPOS → pull_requests.json
      # Fetches open + recent PRs for repos updated in the last 90 days.
      # Writes public/data/pull_requests.json with per-repo counts and
      # a flat history array for the dashboard PR history list.
      # ============================================================
      - name: Fetch PR data for active repos
        env:
          REPOS_PAT: ${{ secrets.REPOS_PAT }}
        run: |
          node << 'EOF'
          (async () => {
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('public/data/repos.json', 'utf8'));
            const repos = Array.isArray(raw) ? raw : (raw.repos || []);

            const cutoff = Date.now() - 90 * 24 * 60 * 60 * 1000;
            const active = repos.filter(r => new Date(r.updated_at).getTime() > cutoff);
            console.log(`Fetching PRs for ${active.length} active repos...`);

            const token = process.env.REPOS_PAT;
            const repoStats = [];
            const history = [];

            for (const repo of active) {
              const res = await fetch(
                `https://api.github.com/repos/asiakay/${repo.name}/pulls?state=all&per_page=30&sort=updated`,
                { headers: { Authorization: `token ${token}`, 'User-Agent': 'repo-dashboard/1.0' } }
              );
              if (!res.ok) { console.log(`  skip ${repo.name}: ${res.status}`); continue; }
              const prs = await res.json();
              if (!Array.isArray(prs) || !prs.length) continue;

              let open = 0, merged = 0, closed = 0;
              for (const pr of prs) {
                if (pr.state === 'open') open++;
                else if (pr.merged_at) merged++;
                else closed++;
                history.push({
                  repo: repo.name,
                  number: pr.number,
                  title: pr.title,
                  state: pr.merged_at ? 'merged' : pr.state,
                  url: pr.html_url,
                  created_at: pr.created_at,
                  merged_at: pr.merged_at || null,
                  closed_at: pr.closed_at || null,
                  author: pr.user?.login || null,
                });
              }
              if (open + merged + closed > 0) {
                repoStats.push({ name: repo.name, open, merged, closed, total: open + merged + closed });
              }
            }

            history.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const output = {
              generated_at: new Date().toISOString(),
              total_prs: history.length,
              repos: repoStats.sort((a, b) => b.total - a.total),
              history: history.slice(0, 300),
            };
            fs.writeFileSync('public/data/pull_requests.json', JSON.stringify(output, null, 2));
            console.log(`Wrote pull_requests.json: ${repoStats.length} repos, ${history.length} PRs`);
          })();
          EOF

      # ============================================================
      # 6c. COMMIT pull_requests.json VIA GITHUB CONTENTS API
      # Uses REPOS_PAT (asiakay = owner with bypass for the
      # "Changes must be made through a pull request" branch protection
      # rule). git-auto-commit-action sees "nothing to commit" for
      # runtime-generated files; the Contents API bypasses that.
      # ============================================================
      - name: Commit pull_requests.json via Contents API
        env:
          REPOS_PAT: ${{ secrets.REPOS_PAT }}
        run: |
          node << 'EOF'
          (async () => {
            const fs = require('fs');
            const content = fs.readFileSync('public/data/pull_requests.json', 'utf8');
            const encoded = Buffer.from(content).toString('base64');
            const headers = {
              'Authorization': `token ${process.env.REPOS_PAT}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json',
              'User-Agent': 'repo-dashboard/1.0',
            };
            // Get current SHA (needed for updates; absent on first create)
            const getRes = await fetch(
              'https://api.github.com/repos/asiakay/repo-dashboard/contents/public/data/pull_requests.json',
              { headers }
            );
            if (!getRes.ok && getRes.status !== 404) {
              throw new Error(`Reading current pull_requests.json failed: HTTP ${getRes.status} ${await getRes.text()}`);
            }
            const existing = getRes.ok ? await getRes.json() : {};
            const body = {
              message: 'chore: update pull_requests.json [skip ci]',
              content: encoded,
              branch: 'main',
            };
            if (existing.sha) body.sha = existing.sha;
            const putRes = await fetch(
              'https://api.github.com/repos/asiakay/repo-dashboard/contents/public/data/pull_requests.json',
              { method: 'PUT', headers, body: JSON.stringify(body) }
            );
            const result = await putRes.json();
            if (!putRes.ok || !result.commit) {
              // Fatal on purpose: a silently failing commit is how repos.json
              // went stale for 11 months without anyone noticing.
              throw new Error(`Commit of pull_requests.json failed: HTTP ${putRes.status} ${JSON.stringify(result)}`);
            }
            console.log(`Committed pull_requests.json at ${result.commit.sha.slice(0, 7)}`);
          })().catch(err => {
            console.error(`::error::${err.message}`);
            process.exit(1);
          });
          EOF

      # ============================================================
      # 7. SYNC GITHUB ISSUES LABELED "claude" → D1 WORK ITEMS
      # ============================================================
      - name: Sync claude-labeled issues to D1
        # Independent of the PR steps above: still runs if they failed.
        if: ${{ !cancelled() && steps.fetch_repos.outcome == 'success' && steps.pii_scan.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPOS_PAT }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          WRITE_TOKEN: ${{ secrets.WRITE_TOKEN }}
        run: |
          node << 'EOF'
          (async () => {
            const token = process.env.GITHUB_TOKEN;
            const dashUrl = (process.env.DASHBOARD_URL || '').replace(/\/$/, '');
            const writeToken = process.env.WRITE_TOKEN || '';

            if (!dashUrl) {
              console.log('DASHBOARD_URL not set — skipping issue sync. Add it to repo secrets to enable.');
              return;
            }

            const fs = require('fs');
            let reposData;
            try {
              reposData = JSON.parse(fs.readFileSync('public/data/repos.json', 'utf8'));
            } catch (e) {
              console.log('Could not read repos.json — skipping issue sync.');
              return;
            }

            const repos = Array.isArray(reposData) ? reposData : (reposData.repos || []);
            const twoDaysAgo = Date.now() - 2 * 24 * 60 * 60 * 1000;

            async function ghFetch(path) {
              const res = await fetch(`https://api.github.com${path}`, {
                headers: { Authorization: `token ${token}`, 'User-Agent': 'repo-dashboard/1.0' }
              });
              if (!res.ok) return null;
              return res.json();
            }

            async function postItem(body) {
              const headers = { 'Content-Type': 'application/json' };
              if (writeToken) headers['Authorization'] = `Bearer ${writeToken}`;
              const res = await fetch(`${dashUrl}/api/work-items`, {
                method: 'POST',
                headers,
                body: JSON.stringify(body),
              });
              if (!res.ok) {
                const text = await res.text();
                console.error(`  POST failed (${res.status}):`, text.slice(0, 200));
              }
            }

            async function closeIssue(repo_name, github_issue_number) {
              const headers = { 'Content-Type': 'application/json' };
              if (writeToken) headers['Authorization'] = `Bearer ${writeToken}`;
              const res = await fetch(`${dashUrl}/api/work-items/close-issue`, {
                method: 'POST',
                headers,
                body: JSON.stringify({ repo_name, github_issue_number }),
              });
              if (!res.ok) console.error(`  close-issue failed (${res.status})`);
            }

            for (const repo of repos) {
              const name = repo.name;

              // Upsert open issues labeled 'claude'
              const open = await ghFetch(`/repos/asiakay/${name}/issues?state=open&labels=claude&per_page=50`);
              if (Array.isArray(open)) {
                for (const issue of open) {
                  if (issue.pull_request) continue;
                  console.log(`  Upserting ${name}#${issue.number}: ${issue.title}`);
                  await postItem({
                    repo_name: name,
                    task_description: issue.title,
                    status: 'not_started',
                    assigned_to: 'agent',
                    source_type: 'github_issue',
                    source_url: issue.html_url,
                    github_issue_number: issue.number,
                    notes: issue.body ? issue.body.slice(0, 500) : null,
                  });
                }
              }

              // Mark recently-closed labeled issues as done
              const closed = await ghFetch(`/repos/asiakay/${name}/issues?state=closed&labels=claude&per_page=20&sort=updated`);
              if (Array.isArray(closed)) {
                for (const issue of closed) {
                  if (issue.pull_request) continue;
                  if (new Date(issue.updated_at).getTime() < twoDaysAgo) continue;
                  console.log(`  Closing ${name}#${issue.number}`);
                  await closeIssue(name, issue.number);
                }
              }
            }

            console.log('Issue sync complete.');
          })();
          EOF

      # ============================================================
      # 8. RECORD LIVE-SITE STATUS IN D1
      # Runs only if the probe and the PII scan succeeded (nothing
      # unscanned leaves the runner), but regardless of the PR and
      # issue-sync steps, so a failure there can't stall site status
      # and a failure here can't stall them.
      # Written straight to D1 with wrangler (same credentials as
      # deploy.yml), so it never has to get through Cloudflare Access.
      # The dashboard reads it via functions/_shared/repos.js.
      # Database name must match database_name in wrangler.jsonc.
      # ============================================================
      - name: Record live-site status in D1
        if: ${{ !cancelled() && steps.probe.outcome == 'success' && steps.pii_scan.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are required to record live-site status in D1."
            exit 1
          fi
          npx --yes wrangler@latest d1 execute repo-dashboard-work-items --remote \
            --file="$RUNNER_TEMP/site-status.sql"

      # ============================================================
      # 9. AUTO-COMMIT CHANGES
      # ============================================================
      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update repos.json + dashboard data"
          file_pattern: |
            public/.nojekyll
            public/data/repos.json
            .project_initialized
            public/**
            worker/**
            scripts/**
            tests/**
            docs/**
